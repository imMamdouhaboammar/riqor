name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install zsh dependency
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and integration tests
        run: bun test

      - name: Check plugin health
        run: bun run plugin:health

      - name: Check skills health
        run: bun run skills:health

      - name: Build and inspect Riqor package
        run: |
          bun run riqor:pack
          bun run riqor:inspect -- packages/riqor/riqor-*.tgz

      - name: Run packaged Riqor tests
        run: bun run riqor:test

      - name: Verify workflow action pins
        run: bun run actions:verify
