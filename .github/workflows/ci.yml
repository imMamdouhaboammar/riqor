name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install zsh dependency
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Riqor runtime for package tests
        run: bun run riqor:build

      - name: Run unit and integration tests
        run: bun test

      - name: Check plugin health
        run: bun run plugin:health

      - name: Check skills health
        run: bun run skills:health

      - name: Build and inspect Riqor package
        run: |
          bun run riqor:pack
          bun run riqor:inspect -- packages/riqor/riqor-*.tgz

      - name: Run packaged Riqor tests
        run: bun run riqor:test

      - name: Verify workflow action pins
        run: bun run actions:verify
