name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install zsh dependency
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release channel
        id: release-channel
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
            npm_tag="${version#*-}"
            npm_tag="${npm_tag%%.*}"
          else
            prerelease="false"
            npm_tag="latest"
          fi
          if [[ ! "$npm_tag" =~ ^[a-zA-Z][a-zA-Z0-9._-]*$ ]]; then
            echo "Invalid npm dist-tag derived from $GITHUB_REF_NAME: $npm_tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        env:
          RELEASE_VERSION: ${{ steps.release-channel.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const pkg = JSON.parse(fs.readFileSync("packages/riqor/package.json", "utf8"));
          const version = process.env.RELEASE_VERSION;
          if (!version || root.version !== version || pkg.version !== version) {
            console.error(`Release version mismatch: tag=${version} root=${root.version} npm=${pkg.version}`);
            process.exit(1);
          }
          NODE

      - name: Build Riqor runtime for package tests
        run: bun run riqor:build

      - name: Run release verification suite
        run: |
          bun test
          bun run plugin:health
          bun run skills:health
          bun run riqor:test
          bun run actions:verify
          bun run backlog:check

      - name: Build Riqor package tarball and plugin ZIP
        run: |
          bun run riqor:pack
          bun run plugin:package

      - name: Inspect and verify package tarball
        run: bun run riqor:inspect -- packages/riqor/riqor-*.tgz

      # NOTE: Automated package deployment to the registry is disabled in GitHub Actions.
      # All npm releases MUST be performed manually from a local developer terminal.

      - name: Fetch and compare published npm tarball
        env:
          RELEASE_VERSION: ${{ steps.release-channel.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/npm-registry
          npm pack "riqor@${RELEASE_VERSION}" --pack-destination dist/npm-registry --silent
          built=(packages/riqor/riqor-*.tgz)
          registry=(dist/npm-registry/riqor-*.tgz)
          [[ ${#built[@]} -eq 1 && ${#registry[@]} -eq 1 ]]
          cmp -- "${built[0]}" "${registry[0]}"
          sha256sum "${built[0]}" "${registry[0]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
        with:
          files: |
            dist/npm-registry/riqor-*.tgz
            dist/plugins/*.zip
          draft: false
          prerelease: ${{ steps.release-channel.outputs.prerelease == 'true' }}
          generate_release_notes: true
