name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install zsh dependency
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Setup npm 11.18.0 for trusted publishing
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Riqor runtime for package tests
        run: bun run riqor:build

      - name: Run CI test suite
        run: |
          bun test
          bun run plugin:health
          bun run skills:health
          bun run actions:verify

      - name: Build Riqor package tarball and plugin ZIP
        run: |
          bun run riqor:pack
          bun run plugin:package

      - name: Inspect and verify package tarball
        run: bun run riqor:inspect -- packages/riqor/riqor-*.tgz

      - name: Publish to npm with trusted publishing
        run: npm publish packages/riqor/riqor-*.tgz --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
        with:
          files: |
            packages/riqor/riqor-*.tgz
            dist/plugins/*.zip
          draft: false
          prerelease: false
