name: Package Reproducibility

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: v0.2.6
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package artifact
        shell: bash
        run: |
          set -euo pipefail
          bun run riqor:pack
          artifact=(packages/riqor/riqor-*.tgz)
          [[ ${#artifact[@]} -eq 1 ]]
          sha256sum "${artifact[0]}" | tee package-sha256.txt
          mkdir -p package-unpacked
          tar -xzf "${artifact[0]}" -C package-unpacked
          find package-unpacked/package -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > package-files-sha256.txt

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riqor-repro-${{ github.run_id }}
          path: |
            packages/riqor/riqor-*.tgz
            package-sha256.txt
            package-files-sha256.txt
          if-no-files-found: error
          retention-days: 1
