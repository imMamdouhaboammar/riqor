<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <style>
      .mono-stroke {
        stroke: #000000;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mono-fill {
        fill: #000000;
        stroke: none;
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 54px;
        font-weight: 800;
        fill: #000000;
        letter-spacing: -1.5px;
      }
      .brand-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #000000;
        letter-spacing: 4.5px;
        text-transform: uppercase;
      }
      @media (prefers-color-scheme: dark) {
        .mono-stroke { stroke: #FFFFFF; }
        .mono-fill { fill: #FFFFFF; }
        .brand-title { fill: #FFFFFF; }
        .brand-tagline { fill: #FFFFFF; }
      }
    </style>
  </defs>

  <g transform="translate(10, 8)">
    <!-- Creative Black & White Doodle Mascot -->
    <g transform="translate(10, 4)">
      <!-- Antenna Stem & Check Flag -->
      <path d="M 40 16 L 40 7" class="mono-stroke" stroke-width="4" />
      <path d="M 40 7 L 49 4 L 40 1" class="mono-stroke" stroke-width="3" />

      <!-- Head Frame (Rounded Doodle Box) -->
      <rect x="10" y="16" width="60" height="54" rx="20" ry="20" class="mono-stroke" stroke-width="4.5" />

      <!-- Left Eye: Magnifying Glass Monocle with Checkmark -->
      <circle cx="28" cy="38" r="9" class="mono-stroke" stroke-width="3" />
      <path d="M 23 38 L 27 42 L 34 33" class="mono-stroke" stroke-width="3" />

      <!-- Right Eye: Creative Winking Sparkle -->
      <path d="M 48 38 L 58 38" class="mono-stroke" stroke-width="3.5" />
      <path d="M 53 33 L 53 43" class="mono-stroke" stroke-width="3.5" />

      <!-- Playful Smile -->
      <path d="M 32 54 Q 40 62 48 54" class="mono-stroke" stroke-width="3.5" />

      <!-- Cute Doodle Hands Holding Loop Shield at Base -->
      <path d="M 22 70 C 22 84 58 84 58 70" class="mono-stroke" stroke-width="4" />
      <path d="M 33 76 L 38 81 L 47 72" class="mono-stroke" stroke-width="3.5" />
    </g>

    <!-- Monochrome Wordmark & Tagline -->
    <g transform="translate(108, 12)">
      <!-- Main Title: Riqor -->
      <text x="0" y="52" class="brand-title">Riqor</text>

      <!-- Tagline: PROOF BEFORE DONE -->
      <text x="2" y="74" class="brand-tagline">PROOF BEFORE DONE</text>
    </g>
  </g>
</svg>
