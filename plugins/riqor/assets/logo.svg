<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">Riqor</title>
  <desc id="desc">Riqor logo with an R verification mark and Proof before done tagline</desc>
  <defs>
    <mask id="r-cut">
      <rect width="128" height="128" fill="white"/>
      <path d="M43 39h20c14 0 22 6 22 17s-8 17-22 17H43z" fill="black"/>
    </mask>
    <style>
      .ink { fill: #111318; }
      .wordmark { font: 800 64px/1 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -3px; }
      .tagline { font: 700 13px/1 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 3.8px; }
      @media (prefers-color-scheme: dark) { .ink { fill: #F7F7F5; } }
    </style>
  </defs>
  <g transform="translate(16 16)">
    <path d="M22 112V16h42c28 0 44 14 44 39 0 20-10 32-29 37l31 20H82L56 94H44v18z" class="ink" mask="url(#r-cut)"/>
    <path d="M55 61l11 11 25-27" fill="none" stroke="#E85D3F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(166 42)">
    <text x="0" y="54" class="ink wordmark">Riqor</text>
    <text x="3" y="84" class="ink tagline">PROOF BEFORE DONE</text>
  </g>
</svg>
